schema: spec-driven

# Project context (shown to AI when creating artifacts)
context: |
  baton 是跑在 DSH 上的 ticket/DAG/session-subagent 控制面：plan face 是
  业务项目的 OpenSpec change（openspec/changes/<id>/tasks.md），认知阶段就是
  OpenSpec 工作流本身。主会话只做机械转发（actions → subagent → bind →
  reconcile），确定性 SessionController 拥有全部状态机。
  关键模块：scripts/_ticket.py（tasks.md 解析器，规范真值
  docs/ticket-format.md）、scripts/_frontier.py（frontier/拓扑排序）、
  scripts/orchestration/session_controller.py（唯一调度器）、
  plan_store.py（queue.db 持久层）、integrator.py（串行集成）。
  纪律：scripts/docs 任何改动后必须跑 ./tests/regression.sh 全绿；
  Python 风格 PEP 585 + dataclass + 标注；仅标准库；tasks.md 是单一票据源，
  格式变更必须 _ticket.py + docs/ticket-format.md + tests 三处同步。

rules:
  proposal:
    - "提案必须写清触发现场（哪个项目的哪次 run 暴露了问题）与不改动时的代价"
  design:
    - "格式类变更先给 ticket-format.md 的规范增量，再写解析器实现要点；语义必须保持向后兼容（无标记的 tasks.md 行为不变）"
  tasks:
    - "任务必须包含：解析器改动 + 规范文档同步 + 单测（含回归：无标记文件哈希/依赖不变）+ regression.sh 验证"

operations:
  archive:
    guidance:
      - "archive 前确认 docs/ticket-format.md、AGENTS.md 术语表、SKILL.md 描述与实现一致（docs follow code 纪律）"
